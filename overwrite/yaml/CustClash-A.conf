[General]
# Custom_OpenClash_Rules
# OpenClash 远程 YAML 覆写模块（标准版）
# 对应配置：cfg/yaml/OpenClashRules-A.yaml
# 模块变量：EN_KEY1=节点订阅链接

DOWNLOAD_FILE = url=https://cdn.jsdelivr.net/gh/CDCEA/Custom_Clash_ConverTemplate@refs/heads/main/cfg/yaml/OpenClashRules-A.yaml, path=/etc/openclash/config/CustClash-A.yaml, force=true
CONFIG_FILE = /etc/openclash/config/CustClash-A.yaml
SUB_INFO_URL = $EN_KEY1
RESTART = true

[Overwrite]
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "provider1" "['url']" "$EN_KEY1"
  
